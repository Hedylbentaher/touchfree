name: CI - images Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Construction des images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image backend (multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: touchfree-backend:ci
      - name: Image frontend (multi-stage)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: touchfree-frontend:ci
      - name: Verification de docker-compose.yml
        run: docker compose config --quiet
