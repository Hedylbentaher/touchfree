name: CI - qualité du code

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les outils de vérification
        run: pip install black flake8

      - name: Vérifier la mise en forme (black)
        run: black --check src backend scripts

      - name: Vérifier le style (flake8)
        run: flake8 src backend scripts

  tests:
    name: Tests Pytest (API)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances de l'API
        run: pip install -r backend/requirements-dev.txt

      - name: Lancer les tests
        run: pytest backend/tests -v
