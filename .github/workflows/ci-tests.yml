name: CI - qualité du code

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les outils de vérification
        run: pip install black flake8

      - name: Vérifier la mise en forme (black)
        run: black --check src backend scripts agent

      - name: Vérifier le style (flake8)
        run: flake8 src backend scripts agent

  tests:
    name: Tests Pytest (API)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances de l'API
        run: pip install -r backend/requirements-dev.txt

      - name: Lancer les tests
        run: pytest backend/tests agent/tests -v

  frontend:
    name: Interface React (ESLint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style (ESLint)
        run: npm run lint

      - name: Construire l'application
        run: npm run build
