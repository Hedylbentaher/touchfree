server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Le navigateur appelle /api/... : nginx transmet a l'API (meme origine, pas de CORS).
    location /api/ {
        proxy_pass http://backend:8000/;
        client_max_body_size 10m;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
